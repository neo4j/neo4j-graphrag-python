name: 'Neo4j-GraphRAG Scheduled E2E Tests'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1,4' # Mon, Thu
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

# Fail fast if uv.lock is out of sync with pyproject.toml, instead of silently
# installing a stale lock (--frozen) or re-resolving on the fly.
env:
  UV_LOCKED: "1"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14']
        neo4j-tag:
          - 'community'
          - 'enterprise'
          - 'latest'
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free up disk space (ubuntu-latest)
        run: |
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /opt/hostedtoolcache
          docker system prune -af || true
          docker volume prune -f || true
          docker builder prune -af || true
          sudo apt-get clean || true
          df -h
      - name: Create Docker network
        run: docker network create test-network
      - name: Start t2v-transformers
        run: |
          for i in 1 2 3; do
            docker pull cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2 \
              && break || sleep $((30 + RANDOM % 30))
          done
          docker run -d --name t2v-transformers \
            --network test-network \
            -e ENABLE_CUDA=0 \
            cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2
      - name: Start Weaviate
        run: |
          for i in 1 2 3; do
            docker pull cr.weaviate.io/semitechnologies/weaviate:1.27.0 \
              && break || sleep $((30 + RANDOM % 30))
          done
          docker run -d --name weaviate \
            --network test-network \
            -p 8080:8080 -p 50051:50051 \
            -e TRANSFORMERS_INFERENCE_API='http://t2v-transformers:8080' \
            -e AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED='true' \
            -e DEFAULT_VECTORIZER_MODULE='text2vec-transformers' \
            -e ENABLE_MODULES='text2vec-transformers' \
            -e CLUSTER_HOSTNAME='node1' \
            cr.weaviate.io/semitechnologies/weaviate:1.27.0
      - name: Start Neo4j
        run: |
          for i in 1 2 3; do
            docker pull neo4j:${{ matrix.neo4j-tag }} \
              && break || sleep $((30 + RANDOM % 30))
          done
          docker run -d --name neo4j \
            --network test-network \
            -p 7687:7687 -p 7474:7474 \
            -e NEO4J_AUTH=neo4j/password \
            -e NEO4J_ACCEPT_LICENSE_AGREEMENT=eval \
            -e NEO4J_PLUGINS='["apoc"]' \
            neo4j:${{ matrix.neo4j-tag }}
      - name: Start Qdrant
        run: |
          for i in 1 2 3; do
            docker pull qdrant/qdrant \
              && break || sleep $((30 + RANDOM % 30))
          done
          docker run -d --name qdrant \
            --network test-network \
            -p 6333:6333 \
            qdrant/qdrant
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Split the combined cache action into restore here and a gated save
      # below: the combined action's post step also ran when the job failed or
      # was cancelled, publishing a half-installed .venv under an exact key
      # derived from uv.lock alone that every later run restored.
      - name: Restore cached venv
        id: cached-venv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}
      # Unconditional: a restored .venv that is missing packages would otherwise
      # be trusted, and the failure surfaces much later as an ImportError inside
      # a test. uv sync is quick when the environment is already correct.
      - name: Install dependencies
        run: uv sync --all-extras --no-extra gpu --group dev
      - name: Save cached venv
        if: steps.cached-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}
      - name: Show disk usage after dependency installation
        run: |
          df -h
      - name: Wait for Weaviate to start
        shell: bash
        run: |
          set +e
          count=0; until curl -s --fail localhost:8080/v1/.well-known/ready; do ((count++)); [ $count -ge 10 ] && echo "Reached maximum retry limit" && exit 1; sleep 15; done
      - name: Wait for Neo4j to be ready
        shell: bash
        run: |
          echo "Waiting for Neo4j to be ready..."
          count=0
          until curl -s --fail http://localhost:7474 > /dev/null 2>&1; do
            ((count++))
            if [ $count -ge 30 ]; then
              echo "Neo4j failed to start within timeout"
              docker logs neo4j
              exit 1
            fi
            echo "Waiting for Neo4j... (attempt $count/30)"
            sleep 5
          done
          echo "Neo4j is ready!"
      - name: Run tests
        shell: bash
        run: |
          if [[ "${{ matrix.neo4j-tag }}" == "latest" || "${{ matrix.neo4j-tag }}" == "community" ]]; then
              uv run pytest -m 'not enterprise_only' ./tests/e2e
          else
              uv run pytest ./tests/e2e
          fi
      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci
